name: Metrics

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  profile-metrics:
    runs-on: ubuntu-latest
    permissions:
      # Required so the built-in GITHUB_TOKEN (used as committer_token below)
      # can push the generated SVGs back to this repository.
      contents: write
    steps:
      # Light-theme render (shown when the viewer's GitHub theme is light)
      - name: Generate metrics (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics/metrics.svg

          base: header
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          config_order: base.header, isocalendar, languages
          config_timezone: America/Toronto

      # Dark-theme render (shown when the viewer's GitHub theme is dark)
      - name: Generate metrics (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics/metrics.dark.svg

          base: header
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          config_order: base.header, isocalendar, languages
          config_timezone: America/Toronto

          # Re-colors the two base text colors used by the classic template
          # (body text and headings) to GitHub's dark-theme equivalents, so the
          # render stays legible on a dark background. extras_css is a
          # supported core option: https://github.com/lowlighter/metrics/blob/latest/source/plugins/core/README.md
          extras_css: |
            svg { color: #c9d1d9 !important; }
            h1, h2, h3 { color: #58a6ff !important; }
